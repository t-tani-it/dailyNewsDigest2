# =============================================================================
# dailyNewsDigest2 - alembic.ini
# -----------------------------------------------------------------------------
# Purpose: Define Alembic migration settings.
# Caution: The real connection URL is injected dynamically in `alembic/env.py`
#          from `app.core.config.get_settings()`.
# Change Log:
#   2026-11-02 - Initial version (Step 1-4)
#   2026-11-03 - Keep this file ASCII-only so Windows cp932 locale can read it.
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+psycopg://digest:change_me_local_only@localhost:5432/digest

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
