# =============================================================================
# dailyNewsDigest2 - alembic.ini
# -----------------------------------------------------------------------------
# 目的（Why）: Alembic マイグレーションの実行設定を定義する。
# 注意（Caution）: 実接続URLは `alembic/env.py` 内で `app.core.config.get_settings()` から動的に注入する。
# 変更履歴（Change Log）:
#   2026-11-02 - 初版作成（Step 1-4）
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+psycopg://digest:change_me_local_only@localhost:5432/digest

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
